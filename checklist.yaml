version: 1
categories:

  - name: "Kod Kalitesi"
    items:
      - id: 1
        check: "Fonksiyonlar tek sorumluluğa uyuyor mu? (SRP)"
        severity: high
      - id: 2
        check: "Kod tekrarı var mı? (DRY ihlali)"
        severity: medium
      - id: 3
        check: "Magic number veya magic string kullanılmış mı?"
        severity: medium
      - id: 4
        check: "Ulaşılamayan veya kullanılmayan (dead) kod var mı?"
        severity: low
      - id: 5
        check: "Fonksiyon/metot karmaşıklığı yüksek mi? (10+ dallanma)"
        severity: high
      - id: 6
        check: "Değişken ve fonksiyon isimleri anlamlı ve tutarlı mı?"
        severity: medium

  - name: "Güvenlik"
    items:
      - id: 7
        check: "Şifre, API key veya token hardcode edilmiş mi?"
        severity: critical
      - id: 8
        check: "SQL injection riski var mı? (raw query kullanımı)"
        severity: critical
      - id: 9
        check: "Kullanıcı girdisi doğrulanıyor ve sanitize ediliyor mu?"
        severity: critical
      - id: 10
        check: "Yetkilendirme kontrolleri her endpoint'te mevcut mu?"
        severity: critical
      - id: 11
        check: "Hassas veriler loglara yazılıyor mu?"
        severity: high
      - id: 12
        check: "Bağımlılıklar (dependency) güncel ve güvenli mi?"
        severity: high

  - name: "Hata Yönetimi"
    items:
      - id: 13
        check: "Exception'lar uygun şekilde yakalanıp işleniyor mu?"
        severity: high
      - id: 14
        check: "Genel 'catch all' exception kullanımı var mı? (anti-pattern)"
        severity: medium
      - id: 15
        check: "Hata mesajları kullanıcıya stack trace sızdırıyor mu?"
        severity: high
      - id: 16
        check: "Kritik işlemler için yeterli loglama yapılıyor mu?"
        severity: medium

  - name: "Performans"
    items:
      - id: 17
        check: "Döngü içinde veritabanı sorgusu var mı? (N+1 problemi)"
        severity: high
      - id: 18
        check: "Gereksiz veya tekrarlayan API çağrısı var mı?"
        severity: medium
      - id: 19
        check: "Büyük veri setleri bellekte tutuluyor mu? (memory leak riski)"
        severity: medium
      - id: 20
        check: "Cache kullanılabilecek yerlerde kullanılıyor mu?"
        severity: low

  - name: "Test"
    items:
      - id: 21
        check: "Yeni eklenen fonksiyonlar için unit test yazılmış mı?"
        severity: high
      - id: 22
        check: "Edge case'ler (boş değer, sınır durumlar) test edilmiş mi?"
        severity: medium
      - id: 23
        check: "Test isimleri ne test ettiğini açıkça ifade ediyor mu?"
        severity: low
      - id: 24
        check: "Mock kullanımı gerçek davranışı gizliyor mu?"
        severity: medium

  - name: "Mimari & Tasarım"
    items:
      - id: 25
        check: "Değişiklik mevcut mimari yapıya uygun mu?"
        severity: high
      - id: 26
        check: "Katmanlar arası sorumluluk ihlali var mı? (ör. UI'da business logic)"
        severity: high
      - id: 27
        check: "Yeni bağımlılıklar gerçekten gerekli mi? (dependency bloat)"
        severity: medium
      - id: 28
        check: "SOLID prensiplerine genel uyum sağlanıyor mu?"
        severity: medium

  - name: "Dokümantasyon"
    items:
      - id: 29
        check: "Public API'lar ve public metodlar dokümante edilmiş mi?"
        severity: medium
      - id: 30
        check: "Karmaşık iş mantığı açıklayan yorum içeriyor mu?"
        severity: low
      - id: 31
        check: "README veya ilgili dokümanlar güncellendi mi?"
        severity: low

  - name: "Kod Standartları"
    items:
      - id: 32
        check: "Proje'nin isimlendirme konvansiyonlarına uyuluyor mu?"
        severity: medium
      - id: 33
        check: "Import'lar düzenli ve kullanılmayanlar temizlenmiş mi?"
        severity: low
      - id: 34
        check: "Dosya ve klasör yapısı proje standardına uygun mu?"
        severity: low
      - id: 35
        check: "Kod formatlama (linter/formatter) kurallarına uyuluyor mu?"
        severity: low
