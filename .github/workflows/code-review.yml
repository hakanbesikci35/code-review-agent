name: Code Review Agent

on:
  push:

permissions:
  contents: read

jobs:
  code-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get diff and changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Tetikleyici: Pull Request"
            git fetch origin ${{ github.base_ref }}
            git diff origin/${{ github.base_ref }}...HEAD > diff.patch
            git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          else
            echo "Tetikleyici: Push"
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "İlk push — son commit diff'i alınıyor"
              git show HEAD > diff.patch
              git show --stat HEAD | grep '|' | awk '{print $1}' > changed_files.txt
            else
              git diff "$BEFORE"..."$AFTER" > diff.patch
              git diff --name-only "$BEFORE"..."$AFTER" > changed_files.txt
            fi
          fi
          echo "=== Değişen dosyalar ==="
          cat changed_files.txt

      - name: Run Code Review Agent
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_NAME: ${{ github.repository }}
          PR_TITLE: ${{ github.event.head_commit.message }}
          PR_AUTHOR: ${{ github.actor }}
        run: python agent/reviewer.py
